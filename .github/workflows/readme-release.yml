name: Parcours du ZIP public sur Mac
on:
  push:
    branches: [qa/mac-readme-132]
permissions:
  contents: read
jobs:
  essai:
    strategy:
      fail-fast: false
      matrix:
        parcours: [rennes-b, n8n, dila-voirie, dila-complet, rennes-a, nantes, tain-1, tain-2, modele]
    runs-on: macos-15
    timeout-minutes: 340
    env:
      PARCOURS: ${{ matrix.parcours }}
      PYTHONUNBUFFERED: '1'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_LISTEN_ADDRESS: '127.0.0.1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Télécharger la version distribuée et lancer CCTP Clair
        shell: bash
        run: |
          set -eu
          sw_vers; uname -m
          url=https://github.com/HafidIdrissi/cctp-clair/releases/download/v1.3.2/CCTP-Clair-Mac.zip
          curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/cctp.zip"
          mkdir -p "$HOME/Documents"
          ditto -x -k "$RUNNER_TEMP/cctp.zip" "$HOME/Documents"
          cd "$HOME/Documents/CCTP Clair"
          test ! -d local
          echo "APP=$PWD" >> "$GITHUB_ENV"
          echo "PY=$PWD/local/macos/python-3.11.18/python/bin/python3.11" >> "$GITHUB_ENV"
          "./Lancer CCTP Clair.command" > "$RUNNER_TEMP/launcher.log" 2>&1 &
          launcher=$!
          for ((i=0; i<180; i++)); do
            if curl -fsS --max-time 2 http://127.0.0.1:8789/health 2>/dev/null; then exit 0; fi
            kill -0 "$launcher" 2>/dev/null || break
            sleep 5
          done
          tail -c 4000 "$RUNNER_TEMP/launcher.log"; exit 1
      - name: Importer les archives officielles DILA
        if: startsWith(matrix.parcours, 'dila')
        shell: bash
        run: |
          set -eu
          cd "$APP"
          df -h .
          if [[ "$PARCOURS" = dila-voirie ]]; then
            printf 'O\n' | "./Actualiser les textes DILA.command"
          else
            SSL_CERT_FILE=/etc/ssl/cert.pem "$PY" -B tools/sync_dila_local.py --scope all --with-deltas
          fi
          "$PY" -B tools/dila_local_store.py status
      - uses: actions/setup-node@v4
        if: matrix.parcours == 'n8n'
        with:
          node-version: '24'
      - name: Installer n8n et importer les trois workflows
        if: matrix.parcours == 'n8n'
        shell: bash
        run: |
          set -eu
          cd "$APP"
          npm install -g n8n --no-audit --no-fund
          n8n --version
          for file in n8n/*.json; do n8n import:workflow --input="$file"; done
          n8n list:workflow | tee "$RUNNER_TEMP/workflows.txt"
          id=$(awk -F'|' '/CCTP Clair · essai local/{print $1}' "$RUNNER_TEMP/workflows.txt")
          test -n "$id"
          n8n execute --id="$id" > "$RUNNER_TEMP/execution.txt"
          curl -fsS http://127.0.0.1:8789/jobs | python3 -c 'import json,sys; print([(j["filename"],j["status"]) for j in json.load(sys.stdin)])'
          n8n start > "$RUNNER_TEMP/n8n.log" 2>&1 &
          for ((i=0;i<60;i++)); do curl -fsS http://127.0.0.1:5678/healthz 2>/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:5678/healthz
          printf '\n' | "./Configurer PISTE.command" > "$RUNNER_TEMP/piste.txt"
          test ! -f local/piste-active
          tail -n 1 "$RUNNER_TEMP/piste.txt" | sed 's/^.*tester un article\. //'
      - name: Tester le parcours de lecture dans un navigateur
        if: "!startsWith(matrix.parcours, 'dila')"
        shell: bash
        run: |
          set -eu
          cd "$APP"
          "$PY" -m pip install --disable-pip-version-check playwright
          "$PY" "$GITHUB_WORKSPACE/tests/readme_public.py"
