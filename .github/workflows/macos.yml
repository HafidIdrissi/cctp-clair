name: Essai sur Mac
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.command'
      - 'tools/**'
      - 'requirements.txt'
      - 'clair.py'
      - 'demo/contrats/**'
      - '.github/workflows/macos.yml'
      - 'tests/macos_essai.py'
permissions:
  contents: read
jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: Installer et analyser depuis le ZIP public
        shell: bash
        run: |
          set -eu
          python3 tools/pack_mac.py "$RUNNER_TEMP/cctp.zip"
          ditto -x -k "$RUNNER_TEMP/cctp.zip" "$RUNNER_TEMP/essai"
          cd "$RUNNER_TEMP/essai/CCTP Clair"
          test -x "Configurer PISTE.command"
          test -x "Actualiser les textes DILA.command"
          "./Lancer CCTP Clair.command" > "$RUNNER_TEMP/lancement.log" 2>&1 &
          launcher=$!
          trap 'kill "$launcher" 2>/dev/null || true' EXIT
          for ((i=0; i<180; i++)); do
            if curl -fsS --max-time 2 http://127.0.0.1:8789/health 2>/dev/null; then break; fi
            if ! kill -0 "$launcher" 2>/dev/null; then break; fi
            sleep 5
          done
          if ! curl -fsS http://127.0.0.1:8789/health; then
            tail -c 4000 "$RUNNER_TEMP/lancement.log"
            tail -c 3000 local/macos/ollama.log || true
            tail -c 3000 local/macos/service.log || true
            exit 1
          fi
          local/macos/python-3.11.18/python/bin/python3.11 "$GITHUB_WORKSPACE/tests/macos_essai.py"
